name: PC Virtual VNC

on:
  workflow_dispatch:
    inputs:
      access_password:
        description: 'Senha para o VNC/PC Virtual'
        required: true
        default: '123456'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Configurar Senha do Usuário
      run: |
        echo "runner:${{ github.event.inputs.access_password }}" | sudo chpasswd
        echo "runner ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/runner
        sudo usermod -aG sudo runner

    - name: Instalar Servidor de Área de Trabalho e Ferramentas
      run: |
        sudo apt update
        sudo apt install -y xfce4 xfce4-goodies tightvncserver dbus-x11 x11-utils

    - name: Configurar Senha e Arquivo de Inicialização do VNC
      run: |
        mkdir -p ~/.vnc
        echo "${{ github.event.inputs.access_password }}" | vncpasswd -f > ~/.vnc/passwd
        chmod 600 ~/.vnc/passwd
        
        # Criando o script de inicialização para o XFCE carregar a interface gráfica corretamente
        echo "#!/bin/bash" > ~/.vnc/xstartup
        echo "xrdb $HOME/.Xresources" >> ~/.vnc/xstartup
        echo "startxfce4 &" >> ~/.vnc/xstartup
        chmod +x ~/.vnc/xstartup

    - name: Iniciar Servidor VNC
      run: |
        vncserver :1 -geometry 1280x720 -depth 24 &
        echo "VNC iniciado na porta 5901"

    - name: Instalar o Ngrok
      uses: ngrok/ngrok-action@v1
      with:
        auth-token: ${{ secrets.NGROK_TOKEN }}

    - name: Expor VNC via Ngrok (TCP)
      run: |
        ngrok tcp 5901 &

    - name: Manter a Máquina Ativa
      run: |
        echo "PC Virtual pronto! Use um cliente VNC (como o VNC Viewer no celular)"
        sleep infinity
