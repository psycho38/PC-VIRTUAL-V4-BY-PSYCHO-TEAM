name: PC Virtual VNC

on:
  workflow_dispatch:
    inputs:
      access_password:
        description: 'Senha para o VNC/PC Virtual'
        required: true
        default: '123456'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Configurar Senha do Usuário
      run: |
        echo "runner:${{ github.event.inputs.access_password }}" | sudo chpasswd
        echo "runner ALL=(ALL) NOPASSWD:ALL" | sudo tee /etc/sudoers.d/runner
        sudo usermod -aG sudo runner

    - name: Instalar Servidor de Área de Trabalho e Ferramentas
      run: |
        sudo apt update
        sudo apt install -y xfce4 xfce4-goodies tightvncserver dbus-x11 x11-utils wget curl

    - name: Configurar Senha e Arquivo de Inicialização do VNC
      run: |
        mkdir -p ~/.vnc
        echo "${{ github.event.inputs.access_password }}" | vncpasswd -f > ~/.vnc/passwd
        chmod 600 ~/.vnc/passwd
        
        echo "#!/bin/bash" > ~/.vnc/xstartup
        echo "xrdb $HOME/.Xresources" >> ~/.vnc/xstartup
        echo "startxfce4 &" >> ~/.vnc/xstartup
        chmod +x ~/.vnc/xstartup

    - name: Iniciar Servidor VNC
      run: |
        vncserver :1 -geometry 1280x720 -depth 24 &
        echo "VNC iniciado na porta 5901"

    - name: Configurar e Iniciar o Ngrok
      run: |
        # Baixa e instala o ngrok oficial
        curl -shttps://ngrok-agent.s3.amazonaws.com/ngrok.asc \
          | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
        echo "deb https://ngrok-agent.s3.amazonaws.com buster main" \
          | sudo tee /etc/apt/sources.list.d/ngrok.list
        sudo apt update && sudo apt install -y ngrok
        
        # Configura o token da sua conta
        ngrok config add-authtoken ${{ secrets.NGROK_TOKEN }}
        
        # Abre a porta TCP do VNC
        ngrok tcp 5901 &

    - name: Manter a Máquina Ativa
      run: |
        echo "PC Virtual pronto! Use o IP e a porta TCP gerados pelo Ngrok no seu aplicativo VNC Viewer."
        sleep infinity
